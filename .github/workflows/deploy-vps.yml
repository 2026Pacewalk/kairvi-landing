name: Deploy to VPS (kairvilighting.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_PATH: ${{ secrets.VPS_PATH || '/var/www/kairvilighting/html' }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::warning::VPS_HOST / VPS_USER / VPS_SSH_KEY secrets not set — skipping VPS deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload build
        if: steps.check.outputs.ready == 'true'
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            dist/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Smoke test
        if: steps.check.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://kairvilighting.com/ || true)
          echo "https://kairvilighting.com -> HTTP $code"
          [ "$code" = "200" ] || echo "::warning::Site did not return 200 yet (DNS/SSL may still be pending)."
