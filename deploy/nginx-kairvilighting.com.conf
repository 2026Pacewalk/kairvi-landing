# /etc/nginx/sites-available/kairvilighting.com
# Static Vite build served by nginx. certbot --nginx adds the 443/SSL blocks.

# www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.kairvilighting.com;
    return 301 https://kairvilighting.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kairvilighting.com;

    root /var/www/kairvilighting/html;
    index index.html;

    access_log /var/log/nginx/kairvilighting.access.log;
    error_log  /var/log/nginx/kairvilighting.error.log;

    # Security headers. nginx drops inherited add_header lines inside any location that
    # sets its own, so each location below repeats them via $sec_* variables.
    set $sec_nosniff "nosniff";
    set $sec_frame   "SAMEORIGIN";
    set $sec_ref     "strict-origin-when-cross-origin";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed Vite bundles — cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options $sec_nosniff always;
        add_header X-Frame-Options $sec_frame always;
        add_header Referrer-Policy $sec_ref always;
        try_files $uri =404;
    }

    # Catalogue PDF
    location ~* \.pdf$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options $sec_nosniff always;
        add_header X-Frame-Options $sec_frame always;
        add_header Referrer-Policy $sec_ref always;
        try_files $uri =404;
    }

    # HTML always fresh so new deploys show immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options $sec_nosniff always;
        add_header X-Frame-Options $sec_frame always;
        add_header Referrer-Policy $sec_ref always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options $sec_nosniff always;
        add_header X-Frame-Options $sec_frame always;
        add_header Referrer-Policy $sec_ref always;
    }
}
